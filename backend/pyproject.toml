[project]
name = "interview-insights-backend"
version = "0.1.0"
description = "FastAPI service for the interview-insights app: project/interview CRUD, audio storage, transcription via AssemblyAI, pain-point extraction via Anthropic Claude."
authors = [
    { name = "Anirudh Reddy", email = "anirudh@brank.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.101.0",
    "assemblyai>=0.64.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.28",
    "sqlalchemy[asyncio]>=2.0.49",
    "tinytag>=2.2.1",
    "uvicorn[standard]>=0.46.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Keep every test on the same event loop as the session-scoped engine
# fixture. Without this, pytest-asyncio defaults to function-scope loops,
# causing "got Future ... attached to a different loop" errors on any
# subsequent test that re-uses the engine connection pool.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: hits real AssemblyAI + Anthropic APIs"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# B011: assert False; B018: useless expression — both are common in tests.
"tests/**" = ["B011", "B018"]
# alembic env.py and autogenerated migrations have their own import style.
"alembic/env.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/versions", "src/", "tests/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "tinytag.*", "assemblyai.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]
